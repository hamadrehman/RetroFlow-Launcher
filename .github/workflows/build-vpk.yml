name: Build RetroFlow VPK

on:
  workflow_dispatch:
  push:
    branches:
      - td/emu4vita-upstream-superset

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zip rsync

      - name: Build VPK
        run: |
          chmod +x scripts/build_vpk.sh
          scripts/build_vpk.sh

      - name: Generate checksums
        run: |
          cd out
          sha256sum RetroFlow_emu4vita.vpk > SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: retroflow-emu4vita-${{ github.sha }}
          name: RetroFlow Emu4Vita build ${{ github.sha }}
          make_latest: true
          generate_release_notes: false
          body: |
            Automated build from `${{ github.ref_name }}` at `${{ github.sha }}`.

            Assets:
            - `RetroFlow_emu4vita.vpk`
            - `SHA256SUMS.txt`
          files: |
            out/RetroFlow_emu4vita.vpk
            out/SHA256SUMS.txt
