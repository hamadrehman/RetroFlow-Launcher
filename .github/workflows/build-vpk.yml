name: Build RetroFlow VPK

on:
  workflow_dispatch:
  push:
    branches:
      - td/emu4vita-launcher

permissions:
  contents: write

env:
  R2_PUBLIC_BASE: https://pub-130a2a321e314a818868d6b171b3da8b.r2.dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zip rsync

      - name: Build VPK
        run: |
          chmod +x scripts/build_vpk.sh
          scripts/build_vpk.sh

      - name: Generate checksums
        run: |
          cd out
          sha256sum RetroFlow_emu4vita.vpk > SHA256SUMS.txt

      - name: Upload mirror to R2
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
        run: |
          curl --fail -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets/${CLOUDFLARE_R2_BUCKET}/objects/RetroFlow_emu4vita.vpk" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --data-binary @out/RetroFlow_emu4vita.vpk
          curl --fail -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets/${CLOUDFLARE_R2_BUCKET}/objects/RetroFlow_SHA256SUMS.txt" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --data-binary @out/SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.sha }}
          name: RetroFlow Emu4Vita build ${{ github.sha }}
          make_latest: true
          generate_release_notes: false
          body: |
            Automated build from `${{ github.ref_name }}` at `${{ github.sha }}`.

            Assets:
            - `RetroFlow_emu4vita.vpk`
            - `SHA256SUMS.txt`
            
            R2 mirror:
            - `${{ env.R2_PUBLIC_BASE }}/RetroFlow_emu4vita.vpk`
            - `${{ env.R2_PUBLIC_BASE }}/RetroFlow_SHA256SUMS.txt`
          files: |
            out/RetroFlow_emu4vita.vpk
            out/SHA256SUMS.txt
